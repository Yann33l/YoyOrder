name: yoyorder

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yoyorder}
      POSTGRES_USER: ${POSTGRES_USER:-yoyorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  server:
    # Dockerfile de production généré par Wasp 0.25 (migrations au démarrage).
    build:
      context: ./app/.wasp/out
    restart: unless-stopped
    env_file:
      - .env.production.server
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-yoyorder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yoyorder}
      JWT_SECRET: ${JWT_SECRET:?Renseigner JWT_SECRET}
      WASP_WEB_CLIENT_URL: ${WASP_WEB_CLIENT_URL:?Renseigner WASP_WEB_CLIENT_URL}
      WASP_SERVER_URL: ${WASP_SERVER_URL:?Renseigner WASP_SERVER_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${YOYORDER_API_PORT:-3101}:3001'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:${YOYORDER_WEB_PORT:-3100}:8080'
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

volumes:
  postgres-data:
