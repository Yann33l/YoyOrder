server {
    listen 8080;
    server_name _;
    # Les redirections conservent le port public du proxy ou de Docker.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        # Wasp produit 200.html pour les routes React sans page pré-rendue.
        try_files $uri $uri/index.html /200.html;
    }
}
